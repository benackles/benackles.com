<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 522 478" width="522" height="478" role="img" aria-labelledby="d-title d-desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="d-title">How benackles.com gets built</title>
  <desc id="d-desc">How benackles.com gets built: Figma holds the design system and hands brand and mockups to Claude Code, which writes the code into an Astro and Tailwind static build. That is committed and pushed to the GitHub main branch, which fires a build hook to Netlify, serving benackles.com. A return path runs from the live site back to Claude Code — review, revise, re-ship.</desc>
  <defs>
    <marker id="d-tip" viewBox="0 0 10 10" refX="6.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 3 1.5 L 6.5 5 L 3 8.5" fill="none" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="d-acc" viewBox="0 0 10 10" refX="6.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 3 1.5 L 6.5 5 L 3 8.5" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="521" height="477" rx="24" fill="#18181b" stroke="#27272a"/>
  <!-- stages -->
  <rect x="70.5" y="34.5" width="425" height="57" rx="12" fill="#18181b" stroke="#27272a"/>
  <text x="86" y="69" font-size="16" font-weight="600" letter-spacing="-0.16" fill="#fafafa">Figma</text>
  <text x="480" y="69" font-size="13.5" text-anchor="end" fill="#71717a">design system</text>
  <rect x="70.5" y="122.5" width="425" height="57" rx="12" fill="#2d3a3a" stroke="#2dd4bf"/>
  <text x="86" y="157" font-size="16" font-weight="600" letter-spacing="-0.16" fill="#2dd4bf">Claude Code</text>
  <text x="480" y="157" font-size="13.5" text-anchor="end" fill="#71717a">the translation</text>
  <rect x="70.5" y="210.5" width="425" height="57" rx="12" fill="#18181b" stroke="#27272a"/>
  <text x="86" y="245" font-size="16" font-weight="600" letter-spacing="-0.16" fill="#fafafa">Astro + Tailwind</text>
  <text x="480" y="245" font-size="13.5" text-anchor="end" fill="#71717a">static build</text>
  <rect x="70.5" y="298.5" width="425" height="57" rx="12" fill="#18181b" stroke="#27272a"/>
  <text x="86" y="333" font-size="16" font-weight="600" letter-spacing="-0.16" fill="#fafafa">GitHub</text>
  <text x="480" y="333" font-size="13.5" text-anchor="end" fill="#71717a">main branch</text>
  <rect x="70.5" y="386.5" width="425" height="57" rx="12" fill="#18181b" stroke="#27272a"/>
  <text x="86" y="421" font-size="16" font-weight="600" letter-spacing="-0.16" fill="#fafafa">Netlify</text>
  <text x="480" y="421" font-size="13.5" text-anchor="end" fill="#71717a">benackles.com</text>
  <!-- forward edges -->
  <line x1="283.0" y1="92" x2="283.0" y2="116" stroke="#71717a" stroke-width="1.5" marker-end="url(#d-tip)"/>
  <text x="299.0" y="111.5" font-size="13" fill="#a1a1aa">brand + mockups</text>
  <line x1="283.0" y1="180" x2="283.0" y2="204" stroke="#71717a" stroke-width="1.5" marker-end="url(#d-tip)"/>
  <text x="299.0" y="199.5" font-size="13" fill="#a1a1aa">writes the code</text>
  <line x1="283.0" y1="268" x2="283.0" y2="292" stroke="#71717a" stroke-width="1.5" marker-end="url(#d-tip)"/>
  <text x="299.0" y="287.5" font-size="13" fill="#a1a1aa">commit + push</text>
  <line x1="283.0" y1="356" x2="283.0" y2="380" stroke="#71717a" stroke-width="1.5" marker-end="url(#d-tip)"/>
  <text x="299.0" y="375.5" font-size="13" fill="#a1a1aa">build hook</text>
  <!-- return path: stage 2's centre, around the left, to stage 5's -->
  <path d="M 70 415 H 40 Q 26 415 26 401 V 165 Q 26 151 40 151 H 64" fill="none" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#d-acc)"/>
  <text x="48" y="283" font-size="12.5" font-weight="500" text-anchor="middle" fill="#2dd4bf" transform="rotate(-90 48 283)">review → revise → re-ship</text>
</svg>
